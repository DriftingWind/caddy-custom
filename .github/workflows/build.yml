name: Build Caddy Custom (Linux/Windows)

on:
  #push:
  #  branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false # 其中一个失败不影响另一个继续构建
      matrix:
        include:
          - os: linux
            arch: amd64
            output_name: caddy-linux-amd64
          - os: windows
            arch: amd64
            output_name: caddy-windows-amd64.exe

    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 安装 Go 环境
        uses: actions/setup-go@v6
        with:
          go-version: "stable"

      - name: 安装 xcaddy 并编译 (${{ matrix.os }}/${{ matrix.arch }})
        run: |
          go install github.com/caddyserver/xcaddy/cmd/xcaddy@latest

          echo "=============== whereis process ============="

          whereis xcaddy

          echo "=============== xcaddy process ============="
          xcaddy build \
            --output ${{ matrix.output_name }} \
            --with github.com/caddy-dns/cloudflare \
            --with github.com/porech/caddy-maxmind-geolocation

          # 查看编译信息
          ./caddy-linux-amd64 build-info

          # 查看编译后的模组列表
          ./caddy-linux-amd64 list-modules
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0

      - name: 上传编译产物到 Actions 结果页
        uses: actions/upload-artifact@v7
        with:
          name: caddy-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ matrix.output_name }}
